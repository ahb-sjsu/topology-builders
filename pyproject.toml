[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-builders"
version = "0.2.0"
description = "Evaluation of IS-IS distributed flooding reduction (draft-ietf-lsr-distoptflood, FRR PR 24128) on emulated networks of stepped density, and the tools behind it: topology generators, FRR IS-IS labs, a measurement harness and a flooding model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew H. Bond", email = "andrew.bond@sjsu.edu" }]
keywords = ["network-topology", "topology-generator", "containerlab", "frr", "is-is", "networkx", "link-state",
            "flooding", "draft-ietf-lsr-distoptflood", "network-namespaces", "fat-tree", "butterfly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = ["networkx"]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[project.scripts]
topology-builders = "topology_builders.__main__:main"

[project.urls]
Homepage = "https://github.com/ahb-sjsu/topology-builders"
Repository = "https://github.com/ahb-sjsu/topology-builders"
Issues = "https://github.com/ahb-sjsu/topology-builders/issues"

[tool.setuptools]
packages = ["topology_builders"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
