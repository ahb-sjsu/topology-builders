[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-builders"
version = "0.1.0"
description = "Network topologies whose density can be stepped at a fixed number of routers"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["networkx"]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[tool.setuptools]
packages = ["topology_builders"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
